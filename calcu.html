
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #151821;
            font-family: Arial, sans-serif;
        }

        .calculator {
            width: 320px;
            padding: 20px;
            background: #252a36;
            border-radius: 18px;
            box-shadow: 0 10px 30px #0005;
        }

        h2 {
            text-align: center;
            color: white;
            margin-top: 0;
        }

        #display {
            width: 100%;
            height: 65px;
            margin-bottom: 15px;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #10131a;
            color: white;
            font-size: 28px;
            text-align: right;
            outline: none;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            height: 55px;
            border: none;
            border-radius: 10px;
            background: #3b4150;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        button:hover {
            background: #50586b;
        }

        .operator {
            background: #e99435;
        }

        .operator:hover {
            background: #f5aa50;
        }

        .action {
            background: #bd4655;
        }

        .equal {
            background: #269b75;
            grid-column: span 2;
        }

        #message {
            min-height: 18px;
            color: #ff9292;
            font-size: 13px;
            text-align: center;
            margin-bottom: 0;
        }
    </style>
</head>

<body>
    <div class="calculator">
        <h2>Calculator</h2>

        <input
            type="text"
            id="display"
            value="0"
            readonly
            aria-label="Calculator display"
        >

        <div class="buttons">
            <button class="action" data-action="clear">AC</button>
            <button class="action" data-action="delete">DEL</button>
            <button class="operator" data-value="%">%</button>
            <button class="operator" data-value="/">÷</button>

            <button data-value="7">7</button>
            <button data-value="8">8</button>
            <button data-value="9">9</button>
            <button class="operator" data-value="*">×</button>

            <button data-value="4">4</button>
            <button data-value="5">5</button>
            <button data-value="6">6</button>
            <button class="operator" data-value="-">−</button>

            <button data-value="1">1</button>
            <button data-value="2">2</button>
            <button data-value="3">3</button>
            <button class="operator" data-value="+">+</button>

            <button data-value="0">0</button>
            <button data-value=".">.</button>
            <button class="equal" data-action="equals">=</button>
        </div>

        <p id="message" role="status"></p>
    </div>

    <script>
        // Get HTML elements using the DOM
        const display = document.getElementById("display");
        const message = document.getElementById("message");
        const buttons = document.querySelector(".buttons");

        // Store the current expression
        let expression = "";
        let justCalculated = false;

        // Update the calculator display
        function updateDisplay() {
            display.value = expression || "0";
        }

        // Handle number and operator input
        function handleInput(value) {
            message.textContent = "";

            if (/^[0-9.]$/.test(value)) {
                if (justCalculated) {
                    expression = "";
                    justCalculated = false;
                }

                // Prevent multiple decimal points in one number
                if (value === ".") {
                    const currentNumber = expression.split(/[+\-*/%]/).pop();

                    if (currentNumber.includes(".")) {
                        return;
                    }

                    if (currentNumber === "") {
                        expression += "0";
                    }
                }

                // Replace the initial zero when entering a number
                if (expression === "0" && value !== ".") {
                    expression = "";
                }

                expression += value;
            } else {
                justCalculated = false;

                // Allow minus at the start for negative numbers
                if (expression === "" && value === "-") {
                    expression = "-";
                } else if (/[+\-*/%]$/.test(expression)) {
                    // Replace the last operator if another is entered
                    expression = expression.slice(0, -1) + value;
                } else if (expression !== "") {
                    expression += value;
                }
            }

            updateDisplay();
        }

        // Parse and calculate the expression safely
        function calculate() {
            if (!expression || /[+\-*/%.]$/.test(expression)) {
                showError("Enter a complete expression");
                return;
            }

            // Only allow numbers, decimal points and arithmetic operators
            if (!/^[0-9+\-*/%. ]+$/.test(expression)) {
                showError("Invalid input");
                return;
            }

            try {
                // Convert the expression into arithmetic tokens
                const tokens = expression.match(
                    /(?:\d+\.?\d*|\.\d+)|[+\-*/%]/g
                );

                if (!tokens || tokens.join("") !== expression) {
                    showError("Invalid expression");
                    return;
                }

                // Evaluate using operator precedence, without eval()
                const values = [];
                const operators = [];

                const precedence = {
                    "+": 1, "-": 1,
                    "*": 2, "/": 2, "%": 2
                };

                function applyOperator() {
                    const b = values.pop();
                    const a = values.pop();
                    const op = operators.pop();

                    if (a === undefined || b === undefined) {
                        throw new Error("Invalid expression");
                    }

                    let result;

                    switch (op) {
                        case "+": result = a + b; break;
                        case "-": result = a - b; break;
                        case "*": result = a * b; break;
                        case "/":
                            if (b === 0) throw new Error("Cannot divide by zero");
                            result = a / b;
                            break;
                        case "%":
                            if (b === 0) throw new Error("Cannot divide by zero");
                            result = a % b;
                            break;
                    }

                    if (!Number.isFinite(result)) {
                        throw new Error("Result is too large");
                    }

                    values.push(result);
                }

                let expectingNumber = true;

                for (let i = 0; i < tokens.length; i++) {
                    const token = tokens[i];

                    if (!isNaN(token)) {
                        if (!expectingNumber) {
                            throw new Error("Invalid expression");
                        }

                        values.push(Number(token));
                        expectingNumber = false;
                    } else if (token === "-" && expectingNumber) {
                        // Handle unary minus, e.g. -5 or 3 * -2
                        const next = tokens[++i];

                        if (next === undefined || isNaN(next)) {
                            throw new Error("Invalid expression");
                        }

                        values.push(-Number(next));
                        expectingNumber = false;
                    } else {
                        if (expectingNumber) {
                            throw new Error("Invalid expression");
                        }

                        while (
                            operators.length &&
                            precedence[operators[operators.length - 1]] >= precedence[token]
                        ) {
                            applyOperator();
                        }

                        operators.push(token);
                        expectingNumber = true;
                    }
                }

                if (expectingNumber) {
                    throw new Error("Invalid expression");
                }

                while (operators.length) {
                    applyOperator();
                }

                const result = values[0];

                expression = String(Number(result.toPrecision(12)));
                justCalculated = true;
                message.textContent = "";
                updateDisplay();

            } catch (error) {
                showError(error.message || "Calculation error");
            }
        }

        // Display error messages
        function showError(text) {
            message.textContent = text;
        }

        // Handle button clicks using event delegation
        buttons.addEventListener("click", function(event) {
            const button = event.target.closest("button");

            if (!button) return;

            const action = button.dataset.action;
            const value = button.dataset.value;

            if (action === "clear") {
                expression = "";
                justCalculated = false;
                message.textContent = "";
                updateDisplay();
            } else if (action === "delete") {
                expression = expression.slice(0, -1);
                justCalculated = false;
                message.textContent = "";
                updateDisplay();
            } else if (action === "equals") {
                calculate();
            } else if (value !== undefined) {
                handleInput(value);
            }
        });

        // Handle keyboard input
        document.addEventListener("keydown", function(event) {
            const key = event.key;

            if (/^[0-9.]$/.test(key)) {
                handleInput(key);
            } else if (["+", "-", "*", "/", "%"].includes(key)) {
                handleInput(key);
            } else if (key === "Enter" || key === "=") {
                event.preventDefault();
                calculate();
            } else if (key === "Backspace") {
                expression = expression.slice(0, -1);
                justCalculated = false;
                message.textContent = "";
                updateDisplay();
            } else if (key === "Escape" || key === "Delete") {
                expression = "";
                justCalculated = false;
                message.textContent = "";
                updateDisplay();
            }
        });
    </script>
</body>
</html>
